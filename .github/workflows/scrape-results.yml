name: Skrapa matchresultat

# Pingar två endpoints var 30:e minut:
#   /api/cron/results    – hämtar matchdata och räknar poäng
#   /api/cron/reminders  – skickar påminnelsemejl, men bara i kvällsfönstret
#                          (19:30-20:30 svensk tid) eller när deadline är nara.
# Bada ar idempotenta och skyddade med CRON_SECRET.
# KRAVS: repo-secreten CRON_SECRET med SAMMA varde som i Vercel.

on:
  schedule:
    # Var 30:e minut 11:00-22:59 UTC (ca 13-00:30 svensk tid).
    - cron: "*/30 11-22 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Ping results-endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repo-secreten CRON_SECRET saknas."
            exit 1
          fi
          code=$(curl -sS --location-trusted --max-time 120 -o /tmp/out.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://www.sskfemman.se/api/cron/results")
          echo "HTTP $code"
          cat /tmp/out.txt
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::results-endpoint svarade $code"
            exit 1
          fi

      - name: Ping reminders-endpoint
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --location-trusted --max-time 60 -o /tmp/rem.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://www.sskfemman.se/api/cron/reminders")
          echo "HTTP $code"
          cat /tmp/rem.txt
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::reminders-endpoint svarade $code"
            exit 1
          fi
