name: Skrapa matchresultat

# Pingar /api/cron/results så matchdata hämtas och poäng räknas flera gånger
# per matchkväll (Vercel Hobby tillåter bara en cron-körning per dygn).
# Endpointen är idempotent och skyddad med CRON_SECRET.
# KRÄVS: repo-secreten CRON_SECRET med SAMMA värde som i Vercel.

on:
  schedule:
    # Var 30:e minut 14:00-22:59 UTC (ca 15-24 svensk tid).
    - cron: "*/30 14-22 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Ping results-endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repo-secreten CRON_SECRET saknas."
            exit 1
          fi
          code=$(curl -sS --location-trusted --max-time 120 -o /tmp/out.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://www.sskfemman.se/api/cron/results")
          echo "HTTP $code"
          cat /tmp/out.txt
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::results-endpoint svarade $code"
            exit 1
          fi
